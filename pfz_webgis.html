    <div id="container">
      <div id="sidebar">
        <div class="sidebar-wrapper">
          <div class="panel panel-default" id="features">
            <div class="panel-body">
              <div id="custom-control"></div>

              <div class="pfz-tools" style="margin-top: 20px; margin-left: 5px; margin-right: 5px; display: flex; justify-content: space-between; align-items: center;">
                <span style="position: absolute; left: 50%; transform: translateX(-50%); font-weight: bold;">
                  Layers
                </span>
                <button id="hideSidebarBtn" title="Hide Sidebar" style="background: none; border: none; font-size: 16px; cursor: pointer;">
                  <i class="fas fa-arrow-left"></i>
                </button>
              </div>

              <div id="layerToggles" style="margin-top: 100px;">
                <label for="SST_IO2" style="display: block; font-size: 13px; margin-bottom: 10px;">
                  <input type="checkbox" id="SST_IO2" value="SST_IO2" onchange="toggleSST(this)"> Sea Surface Temperature
                </label><br>

                <!-- ★ Chlorophyll checkbox ★ -->
                <label for="CURRENTS_IO" style="display: block; font-size: 13px; margin-bottom: 10px;">
                  <input type="checkbox" id="CURRENTS_IO" value="CURRENTS_IO" onchange="toggleCHL(this)"> Chlorophyll
                </label><br>

                <label for="PFZ_LINES" style="display: block; font-size: 13px; margin-bottom: 10px;">
                  <input type="checkbox" id="PFZ_LINES" value="PFZ_LINES" checked> PFZ Advisory
                </label><br>
                <label for="EEZ_LINES" style="display: block; font-size: 13px; margin-bottom: 10px;">
                  <input type="checkbox" id="EEZ_LINES" value="EEZ_LINES" checked> EEZ
                </label><br>
                <label for="Sectors" style="display: block; font-size: 13px; margin-bottom: 10px;">
                  <input type="checkbox" id="Sectors" value="Sectors" checked> Sectors
                </label><br>
                <label for="LandingCentres" style="display: block; font-size: 13px; margin-bottom: 10px;">
                  <input type="checkbox" id="LandingCentres" value="LandingCentres" checked> LandingCentres
                </label><br>
                <label for="Bathymetry" style="display: block; font-size: 13px; margin-bottom: 10px;">
                  <input type="checkbox" id="Bathymetry" value="Bathymetry"> Bathymetry
                </label><br>
              </div>

              <div id="coordinates">Latitude:, Longitude:</div>
            </div>
          </div>
        </div>
      </div>

      <div id="map">
        <div id="floatingTools">
          <div id="printButtonContainer" title="Print Button">

            </button>

            </div>

            </div>
            <div class="god-icon" id="toggleTools" title="Measurement Button">

            </div>
            <div class="tool-bar" id="toolBar" title="Measurement Button">
              <button id="pointTool">
                <img src="img/marker.PNG" alt="Point" />
              </button>
              <button id="lineTool">
                <img src="img/line.PNG" alt="Line" />
              </button>
              <button id="polygonTool">
                <img src="img/polygon.PNG" alt="Polygon" />
              </button>
            </div>
          </div>
        </div>

    <!-- About Modal -->
    <div class="modal fade" id="aboutModal" tabindex="-1" role="dialog">

          <div class="modal-body">

      <h4>Legend</h4>
      <img id="legendImage2" src="" alt="Legend Image">

    <!-- SST Legend (bottom-right, offset left so it doesn't overlap CHL) -->
<div id="sst-legend-container" style="
    position: fixed;
    bottom: 80px;
    right: 40px;
    z-index: 9999;
    display: none;
    background: rgba(255,255,255,0.92);
    border: 1px solid #aaa;
    border-radius: 6px;
    padding: 8px 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    max-width: 150px;
    max-height: 400px;           /* 👈 Add max height */
    overflow-y: auto;            /* 👈 Add vertical scrollbar */
    overflow-x: hidden;          /* 👈 Prevent horizontal scroll if needed */
">
    <div style="font-weight:bold; font-size:12px; margin-bottom:6px; text-align:center; color:#333; position: sticky; top: 0; background: rgba(255,255,255,0.95); padding: 4px 0;">
        Sea Surface Temperature (°C)
    </div>
    <img src="/geoserver/PFZ-TUNA-SST-CHL/wms?SERVICE=WMS&VERSION=1.1.0&REQUEST=GetLegendGraphic&FORMAT=image/png&LAYER=PFZ-TUNA-SST-CHL:sst"
         alt="SST Legend" style="display:block; max-width:100%; height: auto;" />
</div>
<!-- CHL Legend (bottom-right) -->
<div id="chl-legend-container" style="
    position: fixed;
    bottom: 40px;
    right: 20px;
    z-index: 9999;
    display: none;
    background: rgba(255,255,255,0.92);
    border: 1px solid #aaa;
    border-radius: 6px;
    padding: 8px 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    max-width: 220px;">
    <div style="font-weight:bold; font-size:12px; margin-bottom:6px; text-align:center; color:#333;">
        Chlorophyll (mg/m³)
    </div>
    <img src="/geoserver/PFZ-TUNA-SST-CHL/wms?SERVICE=WMS&VERSION=1.1.0&REQUEST=GetLegendGraphic&FORMAT=image/png&LAYER=PFZ-TUNA-SST-CHL:chl"
         alt="CHL Legend" style="display:block; max-width:100%;" />
</div>

    <!-- Bathymetry Legend (bottom-right, shown only when Bathymetry is checked) -->
    <div id="legend-container" style="
      position: fixed;
      top: 50%;
      right: 20px;
      transform: translateY(-50%);
      display: none;
      z-index: 9999;
    ">
      <img
        id="bathymetry-legend"
        src="/geoserver/BathymteryImage/wms?REQUEST=GetLegendGraphic&FORMAT=image/png&LAYER=BathymteryImage:gebcobathymtery&STYLE=Gebco_Bathymetry"
        alt="Bathymetry Legend"
        style="border: 1px solid #ccc; background: white; padding: 5px;">
    </div>


    <!-- JS Libraries -->
    <script src="https://code.jquery.com/jquery-2.1.4.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.5/js/bootstrap.min.js"></script>
    <script src="https://api.tiles.mapbox.com/mapbox.js/plugins/leaflet-locatecontrol/v0.43.0/L.Control.Locate.min.js"></script>
    <script src="assets/leaflet-groupedlayercontrol/leaflet.groupedlayercontrol.js"></script>
    <script src="assets/js/app.js"></script>

    <script src="js/measure.js"></script>
    <script src="js/legend.js"></script>
    <script src="js/print.js"></script>
    <script src="js/icon.js"></script>
    <script src="js/featureinfo.js"></script>
    <script src="js/threddsdata.js"></script>
    <script src="js/jsondata.js"></script>
    <script src="js/layersinsidebar.js"></script>

    <script>
      /* ─────────────────────────────────────────
         CHL WMS Layer + Legend Toggle
         (map variable comes from app.js)
      ───────────────────────────────────────── */
      var chlLayer = L.tileLayer.wms("/geoserver/PFZ-TUNA-SST-CHL/wms", {
        layers: "PFZ-TUNA-SST-CHL:chl",
        format: "image/png",
        transparent: true,
        version: "1.1.0",
        opacity: 0.85,
        attribution: "INCOIS – Chlorophyll"
      });

      function toggleCHL(checkbox) {
        var legendBox = document.getElementById("chl-legend-container");
        if (checkbox.checked) {
          map.addLayer(chlLayer);
          legendBox.style.display = "block";
        } else {
          map.removeLayer(chlLayer);
          legendBox.style.display = "none";
        }
      }
    </script>

    <script>
      /* ── Prevent map scroll inside legend div ── */
      const legendDiv = document.getElementById("legendDiv");
      if (legendDiv) {
        legendDiv.addEventListener("wheel", function (e) {
          e.stopPropagation();
        }, { passive: false });
      }
    </script>

    <script>
      /* ── Hide / Show sidebar ── */
      document.getElementById("hideSidebarBtn").addEventListener("click", function () {
        document.getElementById("sidebar").classList.add("hidden");
      });
      document.getElementById("list-btn").addEventListener("click", function (e) {
        e.preventDefault();
        document.getElementById("sidebar").classList.remove("hidden");
      });
    </script>

    <script>
      /* ── Collapse navbar on mobile link click ── */
      $(document).ready(function () {
        $('.navbar-collapse ul li a').click(function () {
          if ($('.navbar-toggle').is(':visible')) {
            $('.navbar-collapse').collapse('hide');
          }
        });
      });
    </script>

    <script>
      /* ── Stop measurement toolbar from bubbling ── */
      document.getElementById('toggleTools').addEventListener('click', function (event) {
        event.stopPropagation();
      });
    </script>

    <script>
      /* ── Bathymetry legend toggle ── */
      document.getElementById('Bathymetry').addEventListener('change', function () {
        var legend = document.getElementById('legend-container');
        legend.style.display = this.checked ? 'block' : 'none';
      });
    </script>
